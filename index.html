<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NullStack · Viamão</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09151c;color:#f0f8f7;font-family:Arial,sans-serif}#unity-canvas{display:block;width:100vw;height:100vh;outline:0}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse at top,#173b40,#09151c 70%);padding:30px}h1{font-size:clamp(32px,6vw,64px);letter-spacing:-2px;margin:12px 0}small{letter-spacing:4px;color:#73e9c0}p{color:#b4c6ce;font-size:15px;line-height:1.6}progress{width:min(350px,80vw);height:7px;margin:24px auto;accent-color:#73e9c0;border:0}#error{display:none;color:#ffb5ac;max-width:520px}a{color:#73e9c0}
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="0" aria-label="Jogo NullStack Viamão"></canvas>
<section id="loading"><small>NULLSTACK</small><h1>Viamão</h1><p id="status">Preparando a cidade…</p><progress id="progress" value="0" max="1"></progress><p>Multiplayer Windows + navegador · Teclado e mouse<br>P abre o celular · F2 salas · C câmera</p><p id="error">Não foi possível iniciar o jogo. Recarregue a página em um navegador atualizado.<br><a href="https://github.com/gusleaooliveira/nullstack-viamao-releases/releases/latest">Baixar a versão Windows</a></p></section>
<script src="Build/NullStack-Viamao-Web.loader.js?v=1.5.2"></script>
<script>
const canvas=document.getElementById('unity-canvas');
// Some embedded browsers deny pointer lock synchronously. Keep the game running
// with ordinary mouse motion in that case; normal browsers still use pointer lock.
const pointerLock=canvas.requestPointerLock?.bind(canvas);
if(pointerLock)canvas.requestPointerLock=function(){
 if(window.nsPointerLockUnavailable)return;
 try{const result=pointerLock();if(result&&result.catch)result.catch(()=>{window.nsPointerLockUnavailable=true;});return result;}
 catch(error){window.nsPointerLockUnavailable=true;console.warn('Captura do cursor indisponível neste navegador incorporado.');}
};
createUnityInstance(canvas,{
 dataUrl:'Build/NullStack-Viamao-Web.data?v=1.5.2',frameworkUrl:'Build/NullStack-Viamao-Web.framework.js?v=1.5.2',codeUrl:'Build/NullStack-Viamao-Web.wasm?v=1.5.2',
 streamingAssetsUrl:'StreamingAssets',companyName:'NullStack',productName:'NullStack · Viamão',productVersion:'1.5.2',matchWebGLToCanvasSize:true,
},progress=>{document.getElementById('progress').value=progress;document.getElementById('status').textContent='Carregando a cidade… '+Math.round(progress*100)+'%';}).then(()=>{document.getElementById('loading').style.display='none';canvas.focus();}).catch(error=>{console.error(error);document.getElementById('error').style.display='block';document.getElementById('status').textContent='O carregamento foi interrompido.';});
</script>
</body>
</html>
